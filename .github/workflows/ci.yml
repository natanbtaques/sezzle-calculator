name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: |
          set -o pipefail
          go test ./... -race -coverprofile=coverage.out | tee test-output.txt
          go tool cover -func=coverage.out | tee coverage.txt
          echo '### Backend coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep 'coverage:' test-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.txt

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Test with coverage
        run: |
          set -o pipefail
          npm run coverage -- --coverage.reporter=text-summary --coverage.reporter=html --coverage.reporter=json-summary | tee coverage.txt
          echo '### Frontend coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'Statements|Branches|Functions|Lines' coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

  docker:
    name: Docker (full stack smoke test)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test through nginx
        run: |
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          result=$(curl -fsS -X POST http://localhost:3000/api/v1/evaluate \
            -H 'Content-Type: application/json' \
            -d '{"operands":[5,3,2],"operators":["add","multiply"]}')
          echo "$result"
          test "$result" = '{"result":11}'

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down